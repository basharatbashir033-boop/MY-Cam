name: Build MY Cam iOS (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create iOS project, permissions and pods
        run: bash setup_ios.sh

      - name: Build (no code signing)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r MYCam.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MYCam-ipa
          path: MYCam.ipa
